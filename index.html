<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8baf78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Технические работы — Расписание занятий</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #8baf78; --accent-dark: #7ba168; --dark-green: #4a6b3d;
    --light-green: #eaf3e4; --bg: #f4f7f1;
    --text: #2d3b26; --muted: #7a8a72; --glass: rgba(255,255,255,0.6);
    --border: rgba(139,175,120,0.28); --shadow: 0 8px 24px rgba(74,107,61,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(139,175,120,0.22) 0%, transparent 42%),
      radial-gradient(circle at 92% 8%, rgba(234,243,228,0.95) 0%, transparent 50%),
      radial-gradient(circle at 82% 92%, rgba(139,175,120,0.16) 0%, transparent 45%),
      radial-gradient(circle at 18% 82%, rgba(200,220,185,0.4) 0%, transparent 40%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    overscroll-behavior: none;
  }

  .card {
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 36px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: var(--shadow);
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .icon {
    font-size: 72px;
    line-height: 1;
    margin-bottom: 20px;
    display: inline-block;
    animation: wiggle 3s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    10%      { transform: rotate(-8deg); }
    20%      { transform: rotate(8deg); }
    30%      { transform: rotate(-4deg); }
    40%      { transform: rotate(4deg); }
    50%      { transform: rotate(0deg); }
  }

  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--dark-green);
    letter-spacing: -0.4px;
    margin-bottom: 14px;
    line-height: 1.2;
  }

  p {
    font-size: 16px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--light-green);
    color: var(--dark-green);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .badge::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(139,175,120,0.7);
  }
  @keyframes pulse {
    0%   { transform: scale(1);   box-shadow: 0 0 0 0   rgba(139,175,120,0.7); }
    70%  { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(139,175,120,0);  }
    100% { transform: scale(1);   box-shadow: 0 0 0 0   rgba(139,175,120,0);  }
  }

  @media (max-width: 480px) {
    .card { padding: 36px 24px; border-radius: 20px; }
    .icon { font-size: 60px; margin-bottom: 16px; }
    h1    { font-size: 26px; }
    p     { font-size: 15px; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --dark-green: #a8c79a; --light-green: #2a3b22; --bg: #1a231a;
      --text: #e8f0e3; --muted: #98a890;
      --glass: rgba(40,55,40,0.7);
      --border: rgba(139,175,120,0.3);
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    body {
      background-color: #1a231a;
      background-image:
        radial-gradient(circle at 8% 12%, rgba(139,175,120,0.08) 0%, transparent 42%),
        radial-gradient(circle at 92% 8%, rgba(40,55,40,0.6) 0%, transparent 50%),
        radial-gradient(circle at 82% 92%, rgba(139,175,120,0.06) 0%, transparent 45%),
        radial-gradient(circle at 18% 82%, rgba(60,80,55,0.4) 0%, transparent 40%);
    }
  }
</style>
</head>
<body>

  <div class="card">
    <span class="icon">🛠️</span>
    <h1>Ведутся технические работы</h1>
    <p>Мы обновляем сайт расписания. Пожалуйста, зайдите позже — скоро всё заработает.</p>
    <div class="badge">Плановое обновление</div>
  </div>

</body>
</html>
